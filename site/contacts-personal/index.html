<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f4f6f8">
  <meta name="description" content="Personal contact details for Greg Tysick.">
  <title>Greg Tysick | Personal Contact</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1b2a3c; background: #f4f6f8; color-scheme: light; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    main { min-height: 100svh; display: grid; place-items: center; padding: 20px; }
    .card { width: min(100%, 400px); padding: 34px 30px 28px; border: 1px solid #e6eaef; border-radius: 20px; box-shadow: 0 9px 32px rgba(29,49,73,.055); background: #fff; text-align: center; }
    .avatar { position: relative; display: grid; place-items: center; width: 82px; height: 82px; margin: 0 auto 16px; background: #203f68; color: white; border-radius: 50%; overflow: hidden; font-size: 22px; font-weight: 700; }
    .avatar img { display: block; width: 100%; height: 100%; position: absolute; inset: 0; object-fit: cover; object-position: center 24%; }
    h1 { font-size: 29px; line-height: 1.2; letter-spacing: -.04em; margin: 0 0 8px; }
    .intro { font-size: 15px; line-height: 1.5; color: #526377; margin: 0 0 26px; }
    .email { margin: 0 0 22px; overflow-wrap: anywhere; font-size: 15px; color: #29496c; }
    .email a { color: inherit; text-underline-offset: 3px; }
    .buttons { display: grid; gap: 10px; }
    .button { display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 11px 14px; border-radius: 10px; font: inherit; font-size: 15px; font-weight: 650; cursor: pointer; text-decoration: none; }
    .primary { color: #fff; background: #193a66; border: 1px solid #193a66; }
    .primary:hover { background: #254c7b; }
    .secondary { background: #fff; color: #193a66; border: 1px solid #d1dbe5; }
    .secondary:hover { background: #f3f7fb; }
    .note { color: #748195; font-size: 12px; line-height: 1.6; margin: 15px 0 0; }
    .status { margin: 8px 0 0; color: #29496c; font-size: 13px; overflow-wrap: anywhere; }
    :focus-visible { outline: 3px solid #477fc5; outline-offset: 3px; }
    @media(max-width: 550px) {
      :root { background: white; }
      main { padding: 0; place-items: start center; }
      .card { border: 0; border-radius: 0; min-height: 100svh; box-shadow: none; width: 100%; padding: max(46px, env(safe-area-inset-top)) max(25px, env(safe-area-inset-right)) max(25px, env(safe-area-inset-bottom)) max(25px, env(safe-area-inset-left)); }
    }
  </style>
</head>
<body>
  <main>
    <article class="card" aria-label="Greg Tysick personal contact card">
      <div class="avatar"><span aria-hidden="true">GT</span><img src="/assets/greg-contact-profile.png" alt="Greg Tysick" width="82" height="82" onerror="this.hidden=true"></div>
      <h1>Greg Tysick</h1>
      <p class="intro">Nice to meet you!</p>
      <p class="email"><a href="mailto:beautifulinsites@gmail.com">beautifulinsites@gmail.com</a></p>
      <div class="buttons">
        <a class="button primary" type="text/vcard" href="/contacts-personal/greg-tysick.vcf">Save name &amp; email</a>
        <a class="button secondary" href="mailto:beautifulinsites@gmail.com">Send me an email</a>
        <button class="button secondary" id="copy-email" type="button">Copy email address</button>
      </div>
      <p class="note">A personal card for staying in touch. You may be asked to confirm when saving a contact.</p>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </article>
  </main>
  <script>
    document.getElementById('copy-email').addEventListener('click', async () => {
      const status = document.getElementById('status');
      const email = 'beautifulinsites@gmail.com';
      try {
        if (!navigator.clipboard || !window.isSecureContext) throw new Error('Clipboard unavailable');
        await navigator.clipboard.writeText(email);
        status.textContent = 'Email copied.';
      } catch (_) {
        status.textContent = 'Select and copy: ' + email;
      }
    });
  </script>
</body>
</html>
